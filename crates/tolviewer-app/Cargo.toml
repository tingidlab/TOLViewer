[package]
name = "tolviewer-app"
description = "TOLViewer: view, edit, align and clean DNA sequences and alignments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "tolviewer_app"
path = "src/lib.rs"

[[bin]]
name = "tolviewer"
path = "src/main.rs"

[dependencies]
tolviewer-core.workspace = true
tolviewer-io.workspace = true
tolviewer-align.workspace = true
tolviewer-clean.workspace = true
rayon.workspace = true
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
egui_extras = "0.36"
